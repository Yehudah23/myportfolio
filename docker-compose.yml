version: '3.8'

services:
  web:
    build: .
    container_name: myportfolio-web
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=root_password
      - DB_NAME=my-portfolio
    networks:
      - portfolio-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: myportfolio-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: my-portfolio
      MYSQL_USER: portfolio_user
      MYSQL_PASSWORD: portfolio_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - portfolio-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  portfolio-network:
    driver: bridge
