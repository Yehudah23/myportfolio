services:
  - type: web
    name: myportfolio-web
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    port: 80
    envVars:
      - key: DB_HOST
        value: ${DB_HOST}
      - key: DB_NAME
        value: ${DB_NAME}
      - key: DB_USER
        value: ${DB_USER}
      - key: DB_PASS
        value: ${DB_PASS}
      - key: ALLOWED_ORIGINS
        value: "https://${RENDER_EXTERNAL_HOSTNAME}"

  - type: mysql
    name: myportfolio-db
    plan: free
    ipWhitelist: []
    databaseName: my-portfolio
    user: portfolio_user
